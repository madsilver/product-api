spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  structured:
    format:
      console: ecs

    ecs:
      service:
        name: product-api
        version: ${APP_VERSION:unknown}
        environment: prod